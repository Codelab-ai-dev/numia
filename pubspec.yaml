name: numia
description: Tu inteligencia financiera personal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.1

  # Local cache
  hive_flutter: ^1.1.0

  # HTTP (para Groq y Belvo)
  dio: ^5.4.3+1

  # Charts
  fl_chart: ^0.68.0

  # Typography
  google_fonts: ^6.2.1

  # Formatting
  intl: ^0.19.0

  # Animations
  lottie: ^3.1.2

  # File picker (PDF estados de cuenta)
  file_picker: ^8.0.3

  # Utils
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - .env
